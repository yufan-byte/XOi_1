services:
  xoi:
    build:
      context: .
      args:
        XOI_RELEASE_ID: ${XOI_RELEASE_ID:?设置明确的发布版本标签}
    image: xoi:${XOI_RELEASE_ID:?设置明确的发布版本标签}
    container_name: xoi
    restart: unless-stopped
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    pids_limit: 256
    ports:
      # 左边宿主机端口(可用 PORT=.env 覆盖),右边容器内固定端口
      - "127.0.0.1:${PORT:-12121}:12121"
    environment:
      NODE_ENV: prod
      PORT: "12121"
      # 管理员账号仅在【首次初始化数据库】时生效，之后修改请在系统设置里改密
      XOI_ADMIN_USERNAME: ${XOI_ADMIN_USERNAME:-admin}
      XOI_ADMIN_PASSWORD: ${XOI_ADMIN_PASSWORD:?请设置高强度初始管理员密码}
      TZ: Asia/Shanghai
      # ── new-api 模型网关（v3.0 起：账号/额度/日志的唯一权威）──
      # 这几个变量原来没有透传进容器，等于线上必然连不上网关和数据库。在这里显式传。
      #
      # ⚠️ 业务库必须**与 new-api 同库**（决策 D2）：指向 new-api 自己那个 PostgreSQL，
      #    不要在这里再起一个 postgres —— 库分开了，代理收益聚合、线路分组枚举、
      #    「写归属 + 改 users.group」的同事务就全都做不了。
      #    在仓库根目录的 .env 里写好连接串（见 backend/.env.example）。
      NEWAPI_DATABASE_URL: ${NEWAPI_DATABASE_URL:?必须指向 new-api 的 PostgreSQL（决策 D2）}
      NEWAPI_PG_URL: ${NEWAPI_PG_URL:-}
      # 容器内 127.0.0.1 指向 XOi 自己；new-api 是共享网络上的服务别名。
      NEWAPI_BASE_URL: ${NEWAPI_BASE_URL:-http://new-api:3000}
      NEWAPI_ADMIN_TOKEN: ${NEWAPI_ADMIN_TOKEN:?服务端调用网关管理接口所需}
      XOI_DB_POOL_MAX: ${XOI_DB_POOL_MAX:-8}
      XOI_DB_ACQUIRE_TIMEOUT_MS: ${XOI_DB_ACQUIRE_TIMEOUT_MS:-10000}
      XOI_NEWAPI_ONLY: ${XOI_NEWAPI_ONLY:-1}
      XOI_ALLOWED_ORIGINS: ${XOI_ALLOWED_ORIGINS:?设置正式站点 HTTPS origin，多个用逗号分隔}
      XOI_TRUST_PROXY: ${XOI_TRUST_PROXY:-}
      # Required to enable real payments; unset keeps those channels unavailable.
      XOI_PAY_NOTIFY_HOST: ${XOI_PAY_NOTIFY_HOST:-}
      # Confirm gateway BATCH_UPDATE_ENABLED=false before setting sync; this flag does not change the gateway.
      XOI_NEWAPI_QUOTA_MODE: ${XOI_NEWAPI_QUOTA_MODE:?关闭网关批量延迟额度更新并确认后填写 sync}
      XOI_NEWAPI_REDIS_ENABLED: ${XOI_NEWAPI_REDIS_ENABLED:-0}
      XOI_AGENT_DB_POOL_MAX: ${XOI_AGENT_DB_POOL_MAX:-8}
      XOI_MODEL_GLOBAL_CONCURRENCY: ${XOI_MODEL_GLOBAL_CONCURRENCY:-32}
      XOI_MODEL_USER_CONCURRENCY: ${XOI_MODEL_USER_CONCURRENCY:-3}
      XOI_MEDIA_GLOBAL_CONCURRENCY: ${XOI_MEDIA_GLOBAL_CONCURRENCY:-64}
      XOI_MEDIA_USER_CONCURRENCY: ${XOI_MEDIA_USER_CONCURRENCY:-6}
      XOI_MEDIA_WORKERS: ${XOI_MEDIA_WORKERS:-4}
      XOI_MEDIA_QUEUE_GLOBAL_LIMIT: ${XOI_MEDIA_QUEUE_GLOBAL_LIMIT:-128}
      XOI_MEDIA_QUEUE_USER_LIMIT: ${XOI_MEDIA_QUEUE_USER_LIMIT:-8}
      # Existing file-based canvases must pass the checked migration before switching.
      XOI_CANVAS_STORAGE: ${XOI_CANVAS_STORAGE:-postgres}
    volumes:
      # 仅持久化可变数据；程序与静态页面由 /app/release 提供。
      - xoi-data:/app/backend/data
    networks:
      - newapi
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:12121/api/readyz',{signal:AbortSignal.timeout(8000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

volumes:
  xoi-data:

networks:
  newapi:
    external: true
    name: ${NEWAPI_DOCKER_NETWORK:-ops_default}
